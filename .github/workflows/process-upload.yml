name: Process Upload

# Manually triggerable via the Actions tab, or dispatched programmatically
# by the main backend's services/githubActions.js. Kept in its own repo so
# the main/frontend/backend repos stay free of CI-heavy tooling.
on:
  workflow_dispatch:
    inputs:
      film_id:
        description: "MongoDB _id of the film to process"
        required: true
      master_key:
        description: "Object key of the uploaded master video"
        required: true
      storage_provider:
        description: "Which storage provider the master lives on (r2, b2, or storj)"
        required: true

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Report job started
        run: |
          curl -sf -X POST "${{ secrets.BACKEND_CALLBACK_URL }}/api/service/uploads/${{ github.event.inputs.film_id }}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Service-Secret: ${{ secrets.SERVICE_API_SECRET }}" \
            -d "{\"status\":\"running\"}" || true

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Verify ffmpeg is available
        run: |
          ffmpeg -version
          ffprobe -version

      # --- Resolve which provider's credentials/endpoint/bucket to use ---
      # All three providers are S3-compatible, so the same aws-cli commands
      # work for all of them further down — only the endpoint, bucket, and
      # credentials differ. Exported as env vars here (rather than
      # `aws configure set`, which only supports one active profile at a
      # time) so every later `aws s3` command just picks them up
      # automatically via the CLI's standard env-var auth.
      - name: Resolve storage provider credentials
        id: provider
        run: |
          # Newer aws-cli versions default to streaming uploads with an
          # auto-computed checksum ("aws-chunked" transfer encoding). R2
          # tolerates this fine, but Backblaze B2 and Storj's gateway
          # reject it outright with "MissingContentLength" — they expect
          # a plain, definite Content-Length header instead. Forcing the
          # older behavior here fixes uploads on all three providers;
          # this is the aws-cli equivalent of the same fix already
          # applied to the Node SDK client in backend/services/storage.js
          # and the B2/Storj adapters (requestChecksumCalculation).
          echo "AWS_REQUEST_CHECKSUM_CALCULATION=when_required" >> "$GITHUB_ENV"
          echo "AWS_RESPONSE_CHECKSUM_VALIDATION=when_required" >> "$GITHUB_ENV"

          case "${{ github.event.inputs.storage_provider }}" in
            r2)
              echo "endpoint_url=https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" >> "$GITHUB_OUTPUT"
              echo "bucket=${{ secrets.R2_BUCKET }}" >> "$GITHUB_OUTPUT"
              echo "AWS_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}" >> "$GITHUB_ENV"
              echo "AWS_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}" >> "$GITHUB_ENV"
              echo "AWS_DEFAULT_REGION=auto" >> "$GITHUB_ENV"
              ;;
            b2)
              echo "endpoint_url=${{ secrets.B2_ENDPOINT }}" >> "$GITHUB_OUTPUT"
              echo "bucket=${{ secrets.B2_BUCKET }}" >> "$GITHUB_OUTPUT"
              echo "AWS_ACCESS_KEY_ID=${{ secrets.B2_ACCESS_KEY_ID }}" >> "$GITHUB_ENV"
              echo "AWS_SECRET_ACCESS_KEY=${{ secrets.B2_SECRET_ACCESS_KEY }}" >> "$GITHUB_ENV"
              echo "AWS_DEFAULT_REGION=${{ secrets.B2_REGION }}" >> "$GITHUB_ENV"
              ;;
            storj)
              echo "endpoint_url=https://gateway.storjshare.io" >> "$GITHUB_OUTPUT"
              echo "bucket=${{ secrets.STORJ_BUCKET }}" >> "$GITHUB_OUTPUT"
              echo "AWS_ACCESS_KEY_ID=${{ secrets.STORJ_ACCESS_KEY_ID }}" >> "$GITHUB_ENV"
              echo "AWS_SECRET_ACCESS_KEY=${{ secrets.STORJ_SECRET_ACCESS_KEY }}" >> "$GITHUB_ENV"
              echo "AWS_DEFAULT_REGION=us-east-1" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unknown storage_provider: '${{ github.event.inputs.storage_provider }}' (expected r2, b2, or storj)"
              exit 1
              ;;
          esac

      - name: Download master file from storage
        run: |
          aws s3 cp "s3://${{ steps.provider.outputs.bucket }}/${{ github.event.inputs.master_key }}" \
            ./master.mp4 --endpoint-url "${{ steps.provider.outputs.endpoint_url }}"

      - name: Probe video (duration + height)
        id: probe
        run: |
          HEIGHT=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 master.mp4)
          DURATION=$(ffprobe -v error -show_entries format=duration -of csv=p=0 master.mp4)
          echo "height=$HEIGHT" >> "$GITHUB_OUTPUT"
          echo "duration=$DURATION" >> "$GITHUB_OUTPUT"

      - name: Generate thumbnail
        run: ffmpeg -y -ss 5 -i master.mp4 -vframes 1 thumb.jpg

      - name: Generate 30s preview
        run: ffmpeg -y -i master.mp4 -t 30 -vf scale=480:-1 preview.mp4

      - name: Upload results back to the same storage provider
        id: upload
        env:
          MASTER_KEY: ${{ github.event.inputs.master_key }}
        run: |
          # Derive sibling keys from the master's key, stripping its extension,
          # so thumbnail/preview sit next to the master in the same bucket.
          BASE="${MASTER_KEY%.*}"
          THUMB_KEY="${BASE}-thumb.jpg"
          PREVIEW_KEY="${BASE}-preview.mp4"

          aws s3 cp thumb.jpg "s3://${{ steps.provider.outputs.bucket }}/${THUMB_KEY}" \
            --endpoint-url "${{ steps.provider.outputs.endpoint_url }}" --content-type image/jpeg
          aws s3 cp preview.mp4 "s3://${{ steps.provider.outputs.bucket }}/${PREVIEW_KEY}" \
            --endpoint-url "${{ steps.provider.outputs.endpoint_url }}" --content-type video/mp4

          echo "thumb_key=${THUMB_KEY}" >> "$GITHUB_OUTPUT"
          echo "preview_key=${PREVIEW_KEY}" >> "$GITHUB_OUTPUT"

      - name: Report success to backend
        if: success()
        run: |
          curl -sf -X POST "${{ secrets.BACKEND_CALLBACK_URL }}/api/service/uploads/${{ github.event.inputs.film_id }}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Service-Secret: ${{ secrets.SERVICE_API_SECRET }}" \
            -d "{\"status\":\"completed\",\"thumbKey\":\"${{ steps.upload.outputs.thumb_key }}\",\"previewKey\":\"${{ steps.upload.outputs.preview_key }}\",\"sourceHeight\":${{ steps.probe.outputs.height }},\"durationSeconds\":${{ steps.probe.outputs.duration }}}"

      - name: Report failure to backend
        if: failure()
        run: |
          curl -sf -X POST "${{ secrets.BACKEND_CALLBACK_URL }}/api/service/uploads/${{ github.event.inputs.film_id }}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Service-Secret: ${{ secrets.SERVICE_API_SECRET }}" \
            -d "{\"status\":\"failed\",\"error\":\"ffmpeg pipeline failed — check this workflow run's logs\"}"
            